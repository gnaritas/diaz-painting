<!-- og-src.html — source art for public/og.png (1200x630), not served (repo root, 2026-11-19) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#37264a;font-family:"Optima","Gill Sans MT","Gill Sans","Segoe UI",Calibri,sans-serif;color:#efe7f6}
.strip{display:flex;height:10px}
.strip i{display:block;height:10px;flex:1}
.strip i:nth-child(1){background:#c05b74;flex:3}
.strip i:nth-child(2){background:#8ea6c2;flex:2.4}
.strip i:nth-child(3){background:#9cb490;flex:1.8}
.strip i:nth-child(4){background:#dfbe7e;flex:3.2}
.strip i:nth-child(5){background:#a78ac6;flex:1.2}
.main{display:flex;justify-content:space-between;align-items:center;height:610px;padding:40px 64px}
.left{max-width:660px}
.eyebrow{font-size:20px;letter-spacing:.26em;color:#dfbe7e;font-weight:700;text-transform:uppercase}
h1{font-size:96px;line-height:1.02;letter-spacing:0;margin:24px 0 16px;color:#fff}
.sub{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;font-size:26px;color:#d5c9e4;line-height:1.5;margin-bottom:36px}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{border:2px solid #8a72a3;border-radius:999px;padding:12px 22px;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#efe7f6;font-weight:600}
.chip.hot{background:#c05b74;border-color:#c05b74;color:#fff;font-weight:700}
.fan{position:relative;width:420px;height:340px}
.ch{position:absolute;bottom:10px;width:132px;height:180px;border-radius:12px;border:1px solid rgba(255,255,255,.4);box-shadow:0 24px 50px rgba(14,7,22,.6);padding:14px 16px;display:flex;flex-direction:column;justify-content:flex-end;transform-origin:50% 100%}
.ch b{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:rgba(24,16,32,.8)}
.ch em{display:block;width:40px;height:5px;border-radius:3px;background:rgba(24,16,32,.3);margin-top:8px}
.ch:nth-child(1){background:#9cb490;left:0;transform:rotate(-28deg)}
.ch:nth-child(2){background:#8ea6c2;left:86px;transform:rotate(-14deg)}
.ch:nth-child(3){background:#c05b74;left:172px;transform:rotate(0deg);height:204px}
.ch:nth-child(4){background:#dfbe7e;left:258px;transform:rotate(14deg)}
.ch:nth-child(5){background:#a78ac6;left:344px;transform:rotate(28deg)}
</style>
</head>
<body>
<div class="strip"><i></i><i></i><i></i><i></i><i></i></div>
<div class="main">
  <div class="left">
    <div class="eyebrow">Residential painting &middot; Vancouver, WA</div>
    <h1>Diaz Painting</h1>
    <div class="sub">Interior &amp; exterior house painting — prepped clean, hand-cut lines, even coats. 16 Facebook reviews, 100% recommend.</div>
    <div class="chips">
      <div class="chip hot">Quotes: (564) 258-9155</div>
      <div class="chip">Siding &middot; Trim &middot; Rooms</div>
      <div class="chip">Vancouver &middot; 98664</div>
    </div>
  </div>
  <div class="fan">
    <div class="ch"><b>Sage</b><em></em></div>
    <div class="ch"><b>Sky</b><em></em></div>
    <div class="ch"><b>Rose</b><em></em></div>
    <div class="ch"><b>Amber</b><em></em></div>
    <div class="ch"><b>Lilac</b><em></em></div>
  </div>
</div>
<div class="strip"><i></i><i></i><i></i><i></i><i></i></div>
</body>
</html>
